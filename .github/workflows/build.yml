name: Build Haydra V11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;29.0.14206865"

      - name: Get llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git ../llama.cpp
          cd ../llama.cpp
          git checkout 4df29be

      - name: Verify llama.cpp
        run: |
          echo "===== LLAMA.H ====="
          ls -lh ../llama.cpp/include/llama.h

          echo "===== GGML.H ====="
          ls -lh ../llama.cpp/ggml/include/ggml.h

          echo "===== LLAMA COMMIT ====="
          cd ../llama.cpp
          git rev-parse --short HEAD

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Haydra V11
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Haydra V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: Haydra-V11-debug
          path: app/build/outputs/apk/debug/app-debug.apk
