plugins {
    id 'com.android.application'
}

android {
    namespace 'com.haydra.v10'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haydra.v10'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName "11.0"

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}
